<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Transactable multitenant SaaS architecture on Azure</title>
<desc id="desc">Microsoft Marketplace directs customers to the SaaS landing page. Microsoft Entra ID authenticates. Azure Container Apps hosts the web API, migration job, and Marketplace reconciliation job; Key Vault, PostgreSQL, Container Registry, and Azure Monitor support the solution. GitHub Actions deploys via federated identity.</desc>
<rect width="1200" height="740" fill="#ffffff"/>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#243447}
  .title{font-size:23px;font-weight:700}
  .caption{font-size:14px;fill:#526478}
  .group{fill:#f5f9fd;stroke:#8cb6da;stroke-width:2}
  .node{fill:#fff;stroke:#2779b4;stroke-width:2}
  .external{fill:#f9f6ff;stroke:#7c61b5;stroke-width:2}
  .name{font-size:16px;font-weight:700;text-anchor:middle}
  .sub{font-size:12px;text-anchor:middle;fill:#526478}
  .arrow{fill:none;stroke:#386789;stroke-width:2.3;marker-end:url(#arrow)}
  .dash{stroke-dasharray:6 6}
  .tag{font-size:15px;font-weight:700;fill:#245a82}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#386789"/></marker></defs>
<text x="38" y="42" class="title">Transactable multitenant SaaS with Microsoft Marketplace</text>
<text x="38" y="68" class="caption">Reference design: purchase, identity, tenant isolation, entitlement, and lifecycle processing</text>
<rect x="25" y="104" width="250" height="112" rx="12" class="external"/>
<text x="150" y="137" class="name">Microsoft Marketplace</text>
<text x="150" y="160" class="sub">SaaS purchase and</text>
<text x="150" y="180" class="sub">Fulfillment APIs</text>
<rect x="325" y="104" width="242" height="112" rx="12" class="external"/>
<text x="446" y="137" class="name">Customer browser</text>
<text x="446" y="160" class="sub">SaaS landing page</text>
<text x="446" y="180" class="sub">and workspace</text>
<rect x="617" y="104" width="250" height="112" rx="12" class="external"/>
<text x="742" y="137" class="name">Microsoft Entra ID</text>
<text x="742" y="160" class="sub">User authentication</text>
<text x="742" y="180" class="sub">and access tokens</text>
<path d="M275 158 H325" class="arrow"/>
<path d="M567 158 H617" class="arrow"/>
<rect x="25" y="256" width="1149" height="356" rx="18" class="group"/>
<text x="46" y="284" class="tag">Azure subscription / virtual network</text>
<rect x="50" y="312" width="470" height="196" rx="14" fill="#e7f2fb" stroke="#4e99c9" stroke-width="2"/>
<text x="285" y="338" class="name">Azure Container Apps environment</text>
<rect x="71" y="361" width="252" height="114" rx="10" class="node"/>
<text x="197" y="390" class="name">Web/API container</text>
<text x="197" y="412" class="sub">Membership + entitlements</text>
<text x="197" y="431" class="sub">Marketplace landing / webhook</text>
<rect x="343" y="360" width="156" height="115" rx="10" class="node"/>
<text x="421" y="388" class="name">Jobs</text>
<text x="421" y="409" class="sub">Migrations</text>
<text x="421" y="428" class="sub">Reconciliation</text>
<path d="M446 216 V240 H197 V361" class="arrow"/>
<path d="M150 216 V240 H112 V361" class="arrow dash"/>
<rect x="558" y="312" width="285" height="90" rx="10" class="node"/>
<text x="700" y="340" class="name">Azure Database for</text>
<text x="700" y="360" class="name">PostgreSQL</text>
<text x="700" y="380" class="sub">Private access + tenant RLS</text>
<path d="M323 408 H558" class="arrow"/>
<path d="M499 459 H540 V382 H558" class="arrow dash"/>
<rect x="882" y="312" width="260" height="90" rx="10" class="node"/>
<text x="1012" y="345" class="name">Azure Key Vault</text>
<text x="1012" y="368" class="sub">Managed-identity secret access</text>
<path d="M882 356 H843" class="arrow"/>
<rect x="558" y="442" width="285" height="92" rx="10" class="node"/>
<text x="700" y="476" class="name">Azure Container Registry</text>
<text x="700" y="499" class="sub">Immutable container images</text>
<path d="M558 485 H520" class="arrow"/>
<rect x="882" y="442" width="260" height="92" rx="10" class="node"/>
<text x="1012" y="476" class="name">Azure Monitor</text>
